<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NarrativeAI - PDF to Audiobook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .nav { background: rgba(0,0,0,0.2); color: white; padding: 15px 30px; }
        .nav h1 { margin: 0; font-size: 24px; }
        .hero { color: white; padding: 40px 30px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .status { background: #e7f3ff; color: #0066cc; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .upload { border: 3px dashed #667eea; padding: 40px; text-align: center; border-radius: 8px; background: #f9f9f9; cursor: pointer; }
        .upload:hover { background: #f0f0f0; }
        .upload.done { border-color: #28a745; background: #f0fff4; }
        #pdf-file { display: none; }
        .options { display: none; margin: 20px 0; gap: 15px; flex-wrap: wrap; }
        .options.show { display: flex; }
        .opt-group { flex: 1; min-width: 150px; }
        .opt-group label { display: block; font-weight: bold; color: #667eea; margin-bottom: 5px; }
        .opt-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; }
        .btn { padding: 12px 30px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-convert { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-convert:disabled { opacity: 0.5; cursor: not-allowed; }
        .progress { display: none; margin-top: 20px; }
        .progress.show { display: block; }
        .progress-bar { width: 100%; height: 25px; background: #e0e0e0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); width: 0%; }
        .download { display: none; margin-top: 20px; }
        .download.show { display: block; }
        .btn-download { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; }
        .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
        .price { background: #f0f7ff; padding: 15px; border-left: 4px solid #667eea; border-radius: 5px; margin: 15px 0; display: none; }
        .price.show { display: block; }
        footer { text-align: center; color: white; padding: 30px 20px; }
    </style>
</head>
<body>
    <div class="nav">
        <h1>🎙️ NarrativeAI</h1>
    </div>
    
    <div class="hero">
        <h2>Turn Your Text Files into an Audiobook</h2>
        <p>Convert documents to high-quality MP3 audio instantly</p>
    </div>
    
    <div class="container">
        <div class="box">
            <div class="status" id="status">Loading...</div>
            
            <h3>📄 Select Text File</h3>
            <div class="upload" id="uploadBox">
                <div style="font-size: 40px;">📤</div>
                <p><strong>Click here to select file</strong></p>
                <p style="font-size: 12px; color: #666;">PDF, TXT, DOCX, DOC, RTF (max 150MB)</p>
            </div>
            <input type="file" id="pdf-file" accept=".pdf,.txt,.docx,.doc,.rtf">
            
            <div class="options" id="options">
                <div class="opt-group">
                    <label>🎤 Voice</label>
                    <select id="voice">
                        <option value="Joanna">Joanna (Friendly)</option>
                        <option value="Matthew">Matthew (Professional)</option>
                        <option value="Justin">Justin (Warm)</option>
                        <option value="Ivy">Ivy (Bright)</option>
                        <option value="Kendra">Kendra (Upbeat)</option>
                        <option value="Joey">Joey (Cheerful)</option>
                        <option value="Raveena">Raveena (Sophisticated)</option>
                    </select>
                </div>
                <div class="opt-group">
                    <label>😊 Character</label>
                    <select id="character">
                        <option value="neutral" selected>Neutral</option>
                        <option value="narrator">Narrator</option>
                        <option value="excited">Excited</option>
                        <option value="calm">Calm</option>
                        <option value="dramatic">Dramatic</option>
                        <option value="conversational">Conversational</option>
                    </select>
                </div>
                <div class="opt-group">
                    <label>❤️ Emotion</label>
                    <select id="emotion">
                        <option value="neutral" selected>Neutral</option>
                        <option value="happy">Happy</option>
                        <option value="sad">Sad</option>
                        <option value="angry">Angry</option>
                        <option value="surprised">Surprised</option>
                        <option value="sincere">Sincere</option>
                        <option value="thoughtful">Thoughtful</option>
                    </select>
                </div>
                <div class="opt-group">
                    <label>⚡ Speed</label>
                    <select id="speed">
                        <option value="80">Slow</option>
                        <option value="90" selected>Normal</option>
                        <option value="100">Fast</option>
                    </select>
                </div>
                <button class="btn btn-convert" id="convertBtn" disabled>🚀 Convert</button>
            </div>
            
            <div class="price" id="price">✅ Audio Only • £1 per conversion</div>
            
            <div class="progress" id="progress">
                <div>Progress: <span id="percent">0</span>%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="fill" style="width: 0%;"></div>
                </div>
            </div>
            
            <div class="download" id="download">
                <button class="btn btn-download" id="downloadBtn" disabled>🎵 Download MP3</button>
            </div>
        </div>
    </div>
    
    <footer>© 2026 NarrativeAI</footer>

    <script>
    const uploadBox = document.getElementById('uploadBox');
    const fileInput = document.getElementById('pdf-file');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const options = document.getElementById('options');
    const price = document.getElementById('price');
    const progress = document.getElementById('progress');
    const download = document.getElementById('download');
    
    let currentJobId = null;
    let freeLeft = 0;
    
    uploadBox.onclick = function() {
        fileInput.click();
    };
    
    fileInput.onchange = function() {
        const file = this.files[0];
        const validExtensions = ['.pdf', '.txt', '.docx', '.doc', '.rtf'];
        const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
        
        if (file && validExtensions.includes(fileExtension)) {
            uploadBox.classList.add('done');
            uploadBox.innerHTML = '✅<p style="color: #28a745; margin-top: 10px;"><strong>' + file.name + '</strong></p>';
            options.classList.add('show');
            price.classList.add('show');
            if (freeLeft > 0) convertBtn.disabled = false;
        } else {
            alert('Please select a valid text file (PDF, TXT, DOCX, DOC, or RTF)');
        }
    };
    
    convertBtn.onclick = async function() {
        const file = fileInput.files[0];
        if (!file) return;
        
        convertBtn.disabled = true;
        convertBtn.textContent = '⏳ Converting...';
        
        const form = new FormData();
        form.append('pdf_file', file);
        form.append('voice', document.getElementById('voice').value);
        form.append('character', document.getElementById('character').value);
        form.append('emotion', document.getElementById('emotion').value);
        form.append('rate', document.getElementById('speed').value);
        form.append('tier', 'audio_only');
        
        try {
            const res = await fetch('/upload', { method: 'POST', body: form });
            const data = await res.json();
            currentJobId = data.job_id;
            progress.classList.add('show');
            download.classList.add('show');
            pollStatus();
        } catch (e) {
            alert('Error: ' + e);
            convertBtn.disabled = false;
            convertBtn.textContent = '🚀 Convert';
        }
    };
    
    function pollStatus() {
        const timer = setInterval(async function() {
            try {
                const res = await fetch('/jobs/' + currentJobId);
                if (!res.ok) {
                    console.error('Status check failed:', res.status);
                    return;
                }
                const data = await res.json();
                console.log('Job progress:', data.progress, 'Status:', data.status);
                document.getElementById('percent').textContent = data.progress;
                document.getElementById('fill').style.width = data.progress + '%';
                if (data.status === 'completed') {
                    clearInterval(timer);
                    downloadBtn.disabled = false;
                    progress.innerHTML += '<p style="color: #28a745; margin-top: 10px; font-weight: bold;">✅ Conversion complete!</p>';
                } else if (data.status === 'failed') {
                    clearInterval(timer);
                    progress.innerHTML += '<p style="color: #d32f2f; margin-top: 10px; font-weight: bold;">❌ Conversion failed</p>';
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }, 1000);
    }
    
    downloadBtn.onclick = async function() {
        if (!currentJobId) return;
        try {
            const res = await fetch('/download/' + currentJobId + '?type=audio');
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'audiobook.mp3';
            a.click();
            URL.revokeObjectURL(url);
        } catch (e) {
            alert('Download error');
        }
    };
    
    async function init() {
        try {
            const res = await fetch('/api/free-tier');
            const data = await res.json();
            freeLeft = data.remaining;
            status.innerHTML = '✅ ' + freeLeft + ' free conversions today';
            if (freeLeft > 0) convertBtn.disabled = false;
        } catch (e) {
            status.innerHTML = 'Error loading status';
        }
    }
    
    init();
    </script>
</body>
</html>
