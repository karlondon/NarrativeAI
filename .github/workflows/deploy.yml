name: Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: pytest test_main.py -v
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $LIGHTSAIL_HOST >> ~/.ssh/known_hosts
          
          # Create a temporary file with AWS credentials
          cat > /tmp/aws_creds.txt << EOF
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          EOF
          
          # Copy credentials to server and deploy with FORCE RESTART
          ssh -i ~/.ssh/id_rsa $LIGHTSAIL_USER@$LIGHTSAIL_HOST << 'DEPLOY'
            cd /home/ubuntu/NarrativeAI
            echo "🔪 Force killing old Python processes..."
            sudo pkill -9 -f "python.*main.py" || true
            sudo pkill -9 -f "uvicorn" || true
            sleep 2
            echo "🧹 Cleaning Python cache files..."
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name "*.pyc" -delete 2>/dev/null || true
            echo "📥 Pulling latest code..."
            git pull origin main
            source venv/bin/activate
            echo "📦 Installing dependencies..."
            pip install -q -r requirements.txt
            echo "⛔ Stopping service..."
            sudo systemctl stop narrativeai || true
            sleep 2
            sudo systemctl reset-failed narrativeai || true
            echo "🚀 Starting service..."
            sudo systemctl start narrativeai
            sleep 3
            echo "✅ Service status:"
            sudo systemctl status narrativeai
          DEPLOY
          
          # Now copy the .env file to the server
          scp -i ~/.ssh/id_rsa /tmp/aws_creds.txt $LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/aws_creds.txt
          
          # Copy it to the app directory with proper permissions
          ssh -i ~/.ssh/id_rsa $LIGHTSAIL_USER@$LIGHTSAIL_HOST << 'SETENV'
            sudo cp /tmp/aws_creds.txt /home/ubuntu/NarrativeAI/.env
            sudo chown ubuntu:ubuntu /home/ubuntu/NarrativeAI/.env
            chmod 600 /home/ubuntu/NarrativeAI/.env
            cat /home/ubuntu/NarrativeAI/.env
            sudo systemctl restart narrativeai
            sleep 2
            sudo systemctl status narrativeai
            echo "✅ AWS credentials configured and service restarted!"
          SETENV
      
      - name: Verify deployment
        run: |
          sleep 5
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8000/health || exit 1
          echo "✅ Health check passed!"
