name: Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        continue-on-error: true
        run: pytest test_main.py -v || echo "Tests skipped (file not found)"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_SERVER_IP }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USERNAME }}
          LIGHTSAIL_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LIGHTSAIL_KEY" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -H $LIGHTSAIL_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Deploy to Lightsail server
          ssh -i ~/.ssh/lightsail_key -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $LIGHTSAIL_USER@$LIGHTSAIL_HOST << 'DEPLOY'
            set -e
            cd /home/ubuntu/NarrativeAI
            
            echo "Force killing old processes..."
            sudo pkill -9 -f "python.*main.py" || true
            sudo pkill -9 -f "uvicorn" || true
            sleep 2
            
            echo "Cleaning up..."
            git stash || true
            git clean -fd || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name "*.pyc" -delete 2>/dev/null || true
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Installing dependencies..."
            source venv/bin/activate
            pip install -q -r requirements.txt
            
            echo "Stopping narrativeai service..."
            sudo systemctl stop narrativeai || true
            sleep 2
            sudo systemctl reset-failed narrativeai || true
            
            echo "Starting narrativeai service..."
            sudo systemctl start narrativeai
            sleep 3
            
            echo "Service status:"
            sudo systemctl status narrativeai --no-pager
          DEPLOY
      
      - name: Verify deployment
        continue-on-error: true
        run: |
          sleep 5
          curl -f -k https://${{ secrets.LIGHTSAIL_SERVER_IP }}/ -o /dev/null || echo "Health check skipped"
          echo "Deployment workflow completed!"
